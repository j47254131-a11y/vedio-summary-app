<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>유튜브 AI 요약 & 카드뉴스 생성기 (핸드드로운 에디션)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #2b2623;
      --ink-soft: #5c534c;
      --paper: #fffdf7;
      --paper-warm: #faf4e6;
      --dot-color: rgba(43, 38, 35, 0.08);
      --highlighter-yellow: #ffe066;
      --highlighter-mint: #96f2d7;
      --highlighter-pink: #ffadd2;
      --highlighter-sky: #a5d8ff;
      --highlighter-peach: #ffc078;
      --danger: #e03131;

      /* 손으로 그린 듯 살짝 비대칭인 테두리 곡선 */
      --sketch-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
      --sketch-radius-sm: 18px 6px 20px 8px / 8px 20px 6px 18px;
      --sketch-shadow: 4px 4px 0px var(--ink);
      --sketch-shadow-lg: 6px 6px 0px var(--ink);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Gowun Dodum", "Gaegu", -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--paper-warm);
      background-image: radial-gradient(var(--dot-color) 1.3px, transparent 1.3px);
      background-size: 20px 20px;
      color: var(--ink);
      line-height: 1.7;
      padding: 28px 16px 72px;
    }

    .container {
      max-width: 920px;
      margin: 0 auto;
    }

    /* 헤더 */
    header {
      text-align: center;
      margin-bottom: 30px;
    }

    .badge {
      display: inline-block;
      font-family: "Gaegu", cursive;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--ink);
      background: var(--highlighter-mint);
      border: 2px solid var(--ink);
      border-radius: var(--sketch-radius-sm);
      padding: 3px 14px;
      box-shadow: 2px 2px 0px var(--ink);
      transform: rotate(-1.5deg);
      margin-bottom: 12px;
    }

    header h1 {
      font-family: "Gaegu", cursive;
      font-size: 2.35rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin-bottom: 6px;
      display: inline-block;
      background: linear-gradient(transparent 62%, var(--highlighter-yellow) 62%);
      padding: 0 8px;
    }

    header p {
      color: var(--ink-soft);
      font-size: 1rem;
      margin-top: 6px;
    }

    /* 손그림 노트/카드 패널 */
    .panel,
    .result-card,
    .loading-box {
      background: var(--paper);
      border: 2.5px solid var(--ink);
      border-radius: var(--sketch-radius);
      padding: 26px 24px;
      box-shadow: var(--sketch-shadow-lg);
      margin-bottom: 24px;
    }

    .form-group:last-child {
      margin-bottom: 0;
    }

    label {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      font-family: "Gaegu", cursive;
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 10px;
      color: var(--ink);
    }

    label span.hint {
      font-family: "Gowun Dodum", sans-serif;
      font-weight: 400;
      font-size: 0.84rem;
      color: var(--ink-soft);
    }

    input[type="url"] {
      width: 100%;
      padding: 13px 16px;
      font-family: "Gowun Dodum", sans-serif;
      font-size: 1rem;
      border: 2px solid var(--ink);
      border-radius: var(--sketch-radius-sm);
      background: #ffffff;
      color: var(--ink);
      box-shadow: inset 2px 2px 0px rgba(43, 38, 35, 0.06);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    input:focus {
      outline: none;
      background: #fffef9;
      transform: translate(-1px, -1px);
      box-shadow: 3px 3px 0px var(--highlighter-yellow);
    }

    /* 썸네일 미리보기 */
    .preview-box {
      display: none;
      margin-top: 16px;
      padding: 14px;
      border-radius: var(--sketch-radius-sm);
      background: #fffdf5;
      border: 2px dashed var(--ink);
      align-items: center;
      gap: 16px;
      animation: wiggleIn 0.25s ease;
    }

    .preview-box.active {
      display: flex;
    }

    .preview-box img {
      width: 156px;
      height: 90px;
      object-fit: cover;
      border-radius: 10px;
      border: 2px solid var(--ink);
      box-shadow: 2px 2px 0px var(--ink);
      transform: rotate(-1.5deg);
      flex-shrink: 0;
    }

    .preview-info {
      overflow: hidden;
    }

    .preview-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: "Gaegu", cursive;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--ink);
      background: var(--highlighter-mint);
      border: 1.5px solid var(--ink);
      padding: 2px 10px;
      border-radius: 12px;
      margin-bottom: 6px;
    }

    .preview-url {
      font-size: 0.88rem;
      color: var(--ink-soft);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .url-error-text {
      display: none;
      margin-top: 8px;
      font-size: 0.9rem;
      color: var(--danger);
      font-weight: 700;
    }

    .url-error-text.active {
      display: block;
    }

    /* 손그림 버튼 */
    .submit-btn {
      width: 100%;
      margin-top: 20px;
      padding: 14px 20px;
      font-family: "Gaegu", cursive;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--ink);
      background: var(--highlighter-yellow);
      border: 2.5px solid var(--ink);
      border-radius: var(--sketch-radius-sm);
      cursor: pointer;
      box-shadow: var(--sketch-shadow);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    .submit-btn:hover:not(:disabled) {
      transform: translate(-1px, -1px);
      box-shadow: 5px 5px 0px var(--ink);
      background: #ffd43b;
    }

    .submit-btn:active:not(:disabled) {
      transform: translate(3px, 3px);
      box-shadow: 1px 1px 0px var(--ink);
    }

    .submit-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    /* 로딩 상태 */
    .loading-box {
      display: none;
      text-align: center;
      padding: 36px 20px;
    }

    .loading-box.active {
      display: block;
      animation: wiggleIn 0.25s ease;
    }

    .doodle-loader {
      width: 48px;
      height: 48px;
      border: 4px solid var(--ink);
      border-top-color: var(--highlighter-pink);
      border-right-color: var(--highlighter-mint);
      border-radius: 50%;
      margin: 0 auto 14px;
      animation: spin 1s linear infinite;
    }

    .loading-box p {
      font-family: "Gaegu", cursive;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--ink);
    }

    .loading-box span {
      display: block;
      margin-top: 4px;
      font-size: 0.9rem;
      color: var(--ink-soft);
    }

    /* 에러 알림 */
    .alert-box {
      display: none;
      background: #fff5f5;
      border: 2.5px solid var(--danger);
      border-radius: var(--sketch-radius-sm);
      color: #9b1c1c;
      padding: 16px 18px;
      margin-bottom: 24px;
      box-shadow: 3px 3px 0px var(--danger);
      font-size: 0.95rem;
    }

    .alert-box.active {
      display: block;
      animation: wiggleIn 0.25s ease;
    }

    .alert-box strong {
      font-family: "Gaegu", cursive;
      font-size: 1.25rem;
      display: block;
      margin-bottom: 4px;
    }

    /* 결과 카드들 */
    .results-section {
      display: none;
      flex-direction: column;
      gap: 22px;
    }

    .results-section.active {
      display: flex;
      animation: wiggleIn 0.3s ease;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 2px dashed rgba(43, 38, 35, 0.25);
    }

    .card-title {
      font-family: "Gaegu", cursive;
      font-size: 1.5rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .copy-btn {
      padding: 6px 13px;
      font-family: "Gaegu", cursive;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--ink);
      background: #ffffff;
      border: 2px solid var(--ink);
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 2px 2px 0px var(--ink);
      transition: transform 0.1s ease;
    }

    .copy-btn:hover {
      background: var(--highlighter-sky);
      transform: translate(-1px, -1px);
    }

    .copy-btn:active {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0px var(--ink);
    }

    /* 카드 1: 쉬운 말 해설 & 비유 메모 */
    .easy-summary-text {
      font-size: 1rem;
      color: var(--ink);
      white-space: pre-line;
    }

    .analogy-box {
      margin-top: 16px;
      padding: 15px 18px;
      border-radius: var(--sketch-radius-sm);
      background: #fff9db;
      border: 2px solid var(--ink);
      box-shadow: 3px 3px 0px var(--highlighter-yellow);
      color: var(--ink);
      font-size: 0.96rem;
    }

    .analogy-box strong {
      font-family: "Gaegu", cursive;
      font-size: 1.22rem;
      display: block;
      margin-bottom: 4px;
    }

    /* 카드 2: 핵심 3줄 요약 */
    .takeaway-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .takeaway-list li {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      background: #ffffff;
      padding: 13px 16px;
      border-radius: var(--sketch-radius-sm);
      border: 2px solid var(--ink);
      box-shadow: 2px 2px 0px var(--ink);
      font-size: 0.98rem;
    }

    .takeaway-num {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--highlighter-pink);
      border: 2px solid var(--ink);
      color: var(--ink);
      font-family: "Gaegu", cursive;
      font-size: 1.1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 1px;
    }

    /* 카드 3: 핸드드로운 카드뉴스 4장 */
    .cardnews-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .slide-card {
      position: relative;
      border: 2.5px solid var(--ink);
      border-radius: 18px 8px 20px 10px / 10px 20px 8px 18px;
      padding: 20px 18px;
      color: var(--ink);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 255px;
      box-shadow: 4px 4px 0px var(--ink);
    }

    .slide-card:nth-child(1) {
      background: #fff3bf;
      transform: rotate(-0.8deg);
    }
    .slide-card:nth-child(2) {
      background: #d3f9d8;
      transform: rotate(0.8deg);
    }
    .slide-card:nth-child(3) {
      background: #d0ebff;
      transform: rotate(0.6deg);
    }
    .slide-card:nth-child(4) {
      background: #ffe3e3;
      transform: rotate(-0.7deg);
    }

    .slide-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .slide-badge {
      background: #ffffff;
      border: 2px solid var(--ink);
      padding: 2px 10px;
      border-radius: 999px;
      font-family: "Gaegu", cursive;
      font-size: 1rem;
      font-weight: 700;
      box-shadow: 2px 2px 0px var(--ink);
    }

    .slide-title {
      font-family: "Gaegu", cursive;
      font-size: 1.4rem;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 8px;
      word-break: keep-all;
    }

    .slide-body {
      font-size: 0.94rem;
      line-height: 1.55;
      color: var(--ink);
      margin-bottom: 14px;
      word-break: keep-all;
    }

    .slide-visual-tip {
      background: rgba(255, 255, 255, 0.78);
      border: 1.5px dashed var(--ink);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.85rem;
      line-height: 1.45;
      color: var(--ink);
    }

    .slide-visual-tip strong {
      font-family: "Gaegu", cursive;
      font-size: 1rem;
      display: block;
      margin-bottom: 2px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes wiggleIn {
      from { opacity: 0; transform: translateY(6px) scale(0.99); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (max-width: 700px) {
      header h1 { font-size: 1.9rem; }
      .cardnews-grid { grid-template-columns: 1fr; }
      .slide-card { transform: none !important; }
      .preview-box { flex-direction: column; align-items: flex-start; }
      .preview-box img { width: 100%; height: 170px; transform: none; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <span class="badge">✏️ 손그림 노트 에디션</span><br />
      <h1>유튜브 AI 쉬운 요약 & 카드뉴스</h1>
      <p>유튜브 링크만 슥- 붙여넣으면 내용을 쏙쏙 요약하고 손그림 느낌의 4컷 카드뉴스를 그려드려요!</p>
    </header>

    <section class="panel">
      <div class="form-group">
        <label for="youtubeUrlInput">
          <span>🎬 유튜브 링크 (URL)</span>
          <span class="hint">일반 영상 · 단축 링크(youtu.be) · Shorts</span>
        </label>
        <input
          type="url"
          id="youtubeUrlInput"
          placeholder="https://www.youtube.com/watch?v=... 또는 https://youtu.be/..."
        />
        <p class="url-error-text" id="urlErrorText">앗! 올바른 유튜브 영상 주소를 입력해 주세요.</p>

        <div class="preview-box" id="previewBox">
          <img id="thumbnailImg" src="" alt="유튜브 영상 썸네일 미리보기" />
          <div class="preview-info">
            <div class="preview-status">✓ 링크 확인 완료!</div>
            <div class="preview-url" id="previewUrlText"></div>
          </div>
        </div>
      </div>

      <button type="button" class="submit-btn" id="analyzeBtn">
        🖍️ 유튜브 분석 & 카드뉴스 만들기
      </button>
    </section>

    <div class="loading-box" id="loadingBox">
      <div class="doodle-loader"></div>
      <p>Gemini가 영상을 보고 노트에 열심히 정리 중이에요...</p>
      <span>영상 길이에 따라 10~30초 정도 걸릴 수 있어요!</span>
    </div>

    <div class="alert-box" id="alertBox">
      <strong id="alertTitle">잠깐, 문제가 생겼어요!</strong>
      <span id="alertMessage"></span>
    </div>

    <section class="results-section" id="resultsSection">
      <article class="result-card">
        <div class="card-header">
          <h2 class="card-title">💡 이해하기 쉬운 내용 요약</h2>
          <button type="button" class="copy-btn" data-copy="easy">복사하기</button>
        </div>
        <div class="easy-summary-text" id="easySummaryContent"></div>
        <div class="analogy-box" id="analogyBox">
          <strong>🎈 초등학생도 이해하는 쉬운 비유</strong>
          <span id="analogyContent"></span>
        </div>
      </article>

      <article class="result-card">
        <div class="card-header">
          <h2 class="card-title">📌 핵심 포인트 3줄 요약</h2>
          <button type="button" class="copy-btn" data-copy="takeaways">복사하기</button>
        </div>
        <ul class="takeaway-list" id="takeawayList"></ul>
      </article>

      <article class="result-card">
        <div class="card-header">
          <h2 class="card-title">📱 손그림 카드뉴스 구성안 (4장)</h2>
          <button type="button" class="copy-btn" data-copy="cardnews">전체 복사</button>
        </div>
        <div class="cardnews-grid" id="cardnewsGrid"></div>
      </article>
    </section>
  </div>

  <script>
    const youtubeUrlInput = document.getElementById("youtubeUrlInput");
    const urlErrorText = document.getElementById("urlErrorText");
    const previewBox = document.getElementById("previewBox");
    const thumbnailImg = document.getElementById("thumbnailImg");
    const previewUrlText = document.getElementById("previewUrlText");
    const analyzeBtn = document.getElementById("analyzeBtn");

    const loadingBox = document.getElementById("loadingBox");
    const alertBox = document.getElementById("alertBox");
    const alertTitle = document.getElementById("alertTitle");
    const alertMessage = document.getElementById("alertMessage");
    const resultsSection = document.getElementById("resultsSection");

    const easySummaryContent = document.getElementById("easySummaryContent");
    const analogyContent = document.getElementById("analogyContent");
    const takeawayList = document.getElementById("takeawayList");
    const cardnewsGrid = document.getElementById("cardnewsGrid");

    let latestResultData = null;

    function extractYouTubeVideoId(urlString) {
      if (!urlString) return null;
      const trimmed = urlString.trim();
      try {
        const parsed = new URL(trimmed);
        const host = parsed.hostname.replace(/^www\./, "").toLowerCase();

        if (host === "youtu.be") {
          const id = parsed.pathname.split("/").filter(Boolean)[0];
          return isValidVideoId(id) ? id : null;
        }

        if (host === "youtube.com" || host === "m.youtube.com") {
          if (parsed.pathname === "/watch") {
            const id = parsed.searchParams.get("v");
            return isValidVideoId(id) ? id : null;
          }
          const parts = parsed.pathname.split("/").filter(Boolean);
          if (parts.length >= 2 && ["shorts", "embed", "live", "v"].includes(parts[0])) {
            return isValidVideoId(parts[1]) ? parts[1] : null;
          }
        }
      } catch (e) {
        return null;
      }
      return null;
    }

    function isValidVideoId(id) {
      return typeof id === "string" && /^[a-zA-Z0-9_-]{11}$/.test(id);
    }

    function getNormalizedYouTubeUrl(videoId) {
      return `https://www.youtube.com/watch?v=${videoId}`;
    }

    youtubeUrlInput.addEventListener("input", () => {
      const rawValue = youtubeUrlInput.value.trim();
      if (!rawValue) {
        previewBox.classList.remove("active");
        urlErrorText.classList.remove("active");
        return;
      }

      const videoId = extractYouTubeVideoId(rawValue);
      if (videoId) {
        const normalizedUrl = getNormalizedYouTubeUrl(videoId);
        thumbnailImg.src = `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;
        previewUrlText.textContent = normalizedUrl;
        previewBox.classList.add("active");
        urlErrorText.classList.remove("active");
      } else {
        previewBox.classList.remove("active");
        urlErrorText.classList.add("active");
      }
    });

    function showAlert(title, message) {
      alertTitle.textContent = title;
      alertMessage.textContent = message;
      alertBox.classList.add("active");
    }

    function hideAlert() {
      alertBox.classList.remove("active");
    }

    analyzeBtn.addEventListener("click", async () => {
      hideAlert();

      const rawUrl = youtubeUrlInput.value.trim();
      const videoId = extractYouTubeVideoId(rawUrl);

      if (!videoId) {
        urlErrorText.classList.add("active");
        showAlert("유튜브 링크를 확인해 주세요", "올바른 유튜브 영상 URL(youtube.com/watch?v=..., youtu.be/..., shorts 등)을 입력해 주세요.");
        youtubeUrlInput.focus();
        return;
      }

      const youtubeUrl = getNormalizedYouTubeUrl(videoId);

      analyzeBtn.disabled = true;
      resultsSection.classList.remove("active");
      loadingBox.classList.add("active");

      try {
        const response = await fetch("/api/analyze", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ youtubeUrl })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data?.error || "영상 분석 중 오류가 발생했습니다.");
        }

        latestResultData = data;
        renderResults(data);
      } catch (error) {
        showAlert("영상 분석 실패", error.message || "요청 처리 중 오류가 발생했습니다.");
      } finally {
        loadingBox.classList.remove("active");
        analyzeBtn.disabled = false;
      }
    });

    function renderResults(result) {
      easySummaryContent.textContent = result.easySummary || "요약 내용이 없습니다.";
      analogyContent.textContent = result.analogy || "비유 설명이 없습니다.";

      takeawayList.innerHTML = "";
      const takeaways = Array.isArray(result.takeaways) ? result.takeaways.slice(0, 3) : [];
      takeaways.forEach((item, index) => {
        const li = document.createElement("li");
        const numBadge = document.createElement("span");
        numBadge.className = "takeaway-num";
        numBadge.textContent = index + 1;

        const textSpan = document.createElement("span");
        textSpan.textContent = item;

        li.appendChild(numBadge);
        li.appendChild(textSpan);
        takeawayList.appendChild(li);
      });

      cardnewsGrid.innerHTML = "";
      const slides = Array.isArray(result.cardNews) ? result.cardNews.slice(0, 4) : [];
      slides.forEach((slide, idx) => {
        const slideEl = document.createElement("div");
        slideEl.className = "slide-card";

        const topDiv = document.createElement("div");
        topDiv.className = "slide-top";

        const badge = document.createElement("span");
        badge.className = "slide-badge";
        badge.textContent = `컷 ${slide.slideNumber || idx + 1} / 4`;
        topDiv.appendChild(badge);

        const contentDiv = document.createElement("div");
        const titleEl = document.createElement("h3");
        titleEl.className = "slide-title";
        titleEl.textContent = slide.title || "";

        const bodyEl = document.createElement("p");
        bodyEl.className = "slide-body";
        bodyEl.textContent = slide.body || "";

        contentDiv.appendChild(titleEl);
        contentDiv.appendChild(bodyEl);

        const visualDiv = document.createElement("div");
        visualDiv.className = "slide-visual-tip";

        const visualLabel = document.createElement("strong");
        visualLabel.textContent = "✏️ 그림·연출 아이디어";

        const visualText = document.createElement("span");
        visualText.textContent = slide.visualIdea || "";

        visualDiv.appendChild(visualLabel);
        visualDiv.appendChild(visualText);

        slideEl.appendChild(topDiv);
        slideEl.appendChild(contentDiv);
        slideEl.appendChild(visualDiv);

        cardnewsGrid.appendChild(slideEl);
      });

      resultsSection.classList.add("active");
      resultsSection.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    document.querySelectorAll(".copy-btn").forEach((btn) => {
      btn.addEventListener("click", async () => {
        if (!latestResultData) return;
        const type = btn.dataset.copy;
        let textToCopy = "";

        if (type === "easy") {
          textToCopy = `[이해하기 쉬운 내용 요약]\n${latestResultData.easySummary}\n\n[초등학생도 이해하는 쉬운 비유]\n${latestResultData.analogy}`;
        } else if (type === "takeaways") {
          textToCopy = `[핵심 포인트 3줄 요약]\n` + (latestResultData.takeaways || []).map((t, i) => `${i + 1}. ${t}`).join("\n");
        } else if (type === "cardnews") {
          textToCopy = `[SNS 카드뉴스 4장 구성안]\n\n` + (latestResultData.cardNews || [])
            .map((s, i) => `[슬라이드 ${s.slideNumber || i + 1}] ${s.title}\n- 본문: ${s.body}\n- 시각화 아이디어: ${s.visualIdea}`)
            .join("\n\n");
        }

        try {
          await navigator.clipboard.writeText(textToCopy);
          const originalText = btn.textContent;
          btn.textContent = "복사 완료!";
          setTimeout(() => {
            btn.textContent = originalText;
          }, 1500);
        } catch (err) {
          alert("클립보드 복사에 실패했습니다.");
        }
      });
    });
  </script>
</body>
</html>
